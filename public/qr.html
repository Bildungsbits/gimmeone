<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR-Code – Noten-QR</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="alternate icon" type="image/png" href="/favicon-512.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap narrow">
    <section class="card qr-gross-seite">
      <h1 id="titel">QR-Code</h1>
      <p id="info" class="lead">Lade…</p>
      <div class="qr-gross">
        <img id="qr" alt="QR-Code für die Sitzung – zum Scannen bitte groß anzeigen">
      </div>
      <p class="hint">Zum Teilnehmen mit der Kamera-App scannen: <span id="url" class="qr-url"></span></p>
      <p id="meldung" class="meldung fehler"></p>
    </section>
  </main>
  <script src="/qr.js"></script>
</body>
</html>
